services:
  - type: web
    name: chat-backend
    env: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        value: chat-app
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama3-8b-8192
      - key: HUGGING_FACE_API_KEY
        sync: false
      - key: HUGGING_FACE_IMAGE_MODEL
        value: stabilityai/stable-diffusion-xl-base-1.0
